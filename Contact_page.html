<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Location Page</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    integrity="sha512-sA+e0fsd0HX7RTehKvP6t6+hf2kHogNszNkQq0IMQKqZDjzPhUN7NUaXU/8LaVBAYtd1D4zZhwVJ0u3SzQoGxQ=="
    crossorigin=""
  />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    nav {
      background-color: #333;
      color: white;
      padding: 1rem;
      font-size: 1.2rem;
      text-align: center;
    }
    .container {
      display: flex;
      height: calc(100vh - 60px); /* Subtract navbar height */
    }
    .container {
    display: flex;
    height: calc(100vh - 60px);
    padding: 1rem; /* Added padding around the whole container */
    box-sizing: border-box;
    gap: 1rem;
    }

    .map-container {
    flex: 1;
    min-width: 50%;
    margin: 2rem; /* Adds margin around the map */
    box-shadow: 0 2px 8px rgba(0,0,0,0.1); /* Optional: visual depth */
    border-radius: 8px;
    overflow: hidden;
    }

    #map {
    height: 100%;
    width: 100%;
    }

    .info-panel {
    flex: 1;
    padding: 2rem;
    background-color: #f9f9f9;
    box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    border-radius: 8px;
    }

    .info-panel h2 {
      margin-top: 0;
    }
    .info-panel p {
      margin: 0.5rem 0;
    }
  </style>
</head>
<body>
  <nav>📍 Live Location Tracker</nav>
  <div class="container">
    <div class="map-container">
      <div id="map"></div>
    </div>
    <div class="info-panel">
      <h2>Current Location</h2>
      <p><strong>Latitude:</strong> <span id="lat">--</span></p>
      <p><strong>Longitude:</strong> <span id="lng">--</span></p>
      <h3>Contact Info</h3>
      <p><strong>Address:</strong> 123 Main St, Anytown, USA</p>
      <p><strong>Phone:</strong> (123) 456-7890</p>
      <p><strong>Email:</strong> example@email.com</p>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
    integrity="sha512-YU8UHzXcbOyJMbSPLlU6MDQxXeRcxGE4ZUV3N2iwG3VmJ1A+QQjT9Y04Zss6GBq1iAIGwc8OeQTVcUJZe5E1AQ=="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map").setView([51.505, -0.09], 13); // Default: London

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
    }).addTo(map);

    const marker = L.marker([51.505, -0.09]).addTo(map);

    function updateLocation(lat, lng) {
      map.setView([lat, lng], 13);
      marker.setLatLng([lat, lng]);
      document.getElementById("lat").textContent = lat.toFixed(6);
      document.getElementById("lng").textContent = lng.toFixed(6);
    }

    // Get live location
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          updateLocation(position.coords.latitude, position.coords.longitude);
        },
        (error) => {
          console.error("Error getting location:", error.message);
        },
        {
          enableHighAccuracy: true,
        }
      );
    } else {
      alert("Geolocation is not supported by your browser.");
    }
  </script>
</body>
</html>
